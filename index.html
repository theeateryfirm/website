<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Eatery Firm — client portal mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#F3ECE0}

body{padding-bottom:72px}
.screen{min-height:100vh;display:flex;flex-direction:column;background:#F3ECE0;color:#1F3A30;font-family:Inter,system-ui,sans-serif}
.screen>*{flex:1 0 auto}
.screen[hidden]{display:none}
#demo-nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(31,58,48,0.94);padding:6px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,0.25);font:600 13px Inter,system-ui,sans-serif}
#demo-nav span{color:#E2A962;padding:0 10px;display:flex;align-items:center}
#demo-nav a{color:#D9E0DB;text-decoration:none;padding:8px 12px;border-radius:9px;min-height:20px}
#demo-nav a:hover{background:#2C4D41;color:#fff}
#demo-nav a.on{background:#C1904A;color:#1F3A30}
#tabbar{display:none}
.side a.ai-nav{border:1px solid rgba(226,169,98,.5);background:rgba(226,169,98,.08);margin-bottom:6px;font-weight:600 !important;color:#fff !important}
.side a.ai-nav svg{color:#E2A962}
.side a.ai-nav.on{background:#C1904A;color:#1F3A30 !important}
.side a.ai-nav.on svg{color:#1F3A30}
#tabbar a.ai-tab svg{color:#E2A962}

.m-only{display:none}
@media (max-width:720px){
  body{padding-top:44px}
  #demo-nav{top:0;bottom:auto;left:0;right:0;transform:none;max-width:none;border-radius:0;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding:4px 8px;gap:2px;font-size:12px;height:44px;box-sizing:border-box;box-shadow:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #demo-nav::-webkit-scrollbar{display:none}
  #demo-nav span{white-space:nowrap;padding:0 8px 0 4px}
  #demo-nav a{white-space:nowrap;padding:8px 10px;display:flex;align-items:center}
  .m-only{display:block}
  .d-only{display:none !important}
  /* Home page header */
  .hdr{padding:10px 16px !important;gap:8px 12px !important;flex-wrap:wrap}
  .hdr .hnav{order:3;flex:1 1 100% !important;flex-wrap:nowrap !important;overflow-x:auto;gap:0 20px !important;scrollbar-width:none}
  .hdr .hnav::-webkit-scrollbar{display:none}
  .hdr .hnav a{white-space:nowrap;min-height:40px !important;font-size:14px !important}
  .hdr .hact{margin-left:auto}
  .hdr .hact .btn{min-height:40px !important;padding:0 12px !important;font-size:14px !important}
  .hdr .hact .btn-ghost{display:none !important}
  header.mhead{top:44px !important}
  /* Client portal: sidebar becomes a slim top bar, nav moves to the bottom tab bar */
  .side{flex:1 1 100% !important;flex-direction:row !important;align-items:center;justify-content:space-between;padding:8px 16px !important;position:sticky;top:44px;z-index:20;min-height:52px}
  .side > :not(:first-child){display:none !important}
  .side > a:first-child{margin-bottom:0 !important;min-height:36px !important;padding:0 !important}
  .side > a:first-child:hover{background:none !important}
  body[data-app="1"] #tabbar{display:flex}
  body[data-app="1"] .screen main{padding-bottom:96px !important}
  #tabbar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:#1F3A30;border-top:1px solid #2C4D41;padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;font:600 11px Inter,system-ui,sans-serif}
  #tabbar a{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;color:#C6D1CB;text-decoration:none;border-radius:12px}
  #tabbar a.on{color:#E2A962;background:rgba(226,169,98,0.12)}
  #tabbar svg{width:22px;height:22px}
  /* Sign-up: compact step header */
  nav[aria-label="Sign-up steps"]{display:none !important}
}


.screen{background:#F3ECE0}
:root{--copper:#B5703A}
.pin{height:6px;background:repeating-linear-gradient(180deg,#B5703A 0 1px,transparent 1px 3px);opacity:.85}

<a href="#Main" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1F3A30"><svg aria-hidden="true" width="32" height="32" viewBox="0 0 40 48" style="flex:none"><rect x="4" y="12" width="5" height="18" rx="2.5" fill="#223D33"/><rect x="12.5" y="6" width="5" height="24" rx="2.5" fill="#223D33"/><rect x="21" y="2" width="5" height="28" rx="2.5" fill="#223D33"/><rect x="29.5" y="0" width="5" height="30" fill="#C1904A"/><path d="M4 24h30.5v4c0 6-5 9.5-10.5 12H15C9 37.5 4 34 4 28z" fill="#223D33"/><rect x="17" y="34" width="6" height="14" rx="3" fill="#223D33"/></svg><span class="h" style="font-weight: 700; font-size: 18px">The Eatery Firm</span></a>
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #2E6B4F"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>Secure sign-up · encrypted in transit and at rest</span>
</div>
</header>

<div style="max-width: 1180px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 40px 24px 64px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

<nav aria-label="Sign-up steps" style="flex: 1 1 260px; max-width: 320px; display: flex; flex-direction: column; gap: 4px; background: #EFE9DD; border-radius: 16px; padding: 12px">
<template data-for="steps" data-as="s">
<button type="button" class="{{ s.cls }}" onClick="{{ s.go }}"><span class="{{ s.dotCls }}">{{ s.n }}</span><span>{{ s.label }}</span></button>
</template>
<div style="margin-top: 12px; padding: 12px; font-size: 13px; line-height: 1.5" class="muted">Takes about 10 minutes. You can save and come back — we email you a secure link.</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0">
<div class="m-only" style="margin-bottom: 16px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px"><strong>Step {{ stepNo }} of 6</strong><span class="muted">{{ stepLabel }}</span></div>
<div style="height: 6px; background: #E5DED0; border-radius: 999px; margin-top: 8px; overflow: hidden"><div style="height: 100%; width: {{ stepPct }}%; background: #2A5243; border-radius: 999px"></div></div>
</div>
<div class="card" style="padding: 36px; display: flex; flex-direction: column; gap: 24px">

<template data-if="s0">
<div style="display: flex; flex-direction: column; gap: 20px">
<div><h1 class="h" style="margin: 0 0 6px; font-size: 32px">Create your secure account</h1><p class="muted" style="margin: 0">This is how you'll log in to see reports and talk to your accountant.</p></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<label class="f">First name<input type="text" autocomplete="given-name"></label>
<label class="f">Last name<input type="text" autocomplete="family-name"></label>
<label class="f">Email<input type="email" autocomplete="email"></label>
<label class="f">Mobile<input type="tel" autocomplete="tel"><span class="hint">Used for two-step sign-in codes</span></label>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<button type="button" class="btn btn-ghost" style="width: 100%">Continue with Google</button>
<button type="button" class="btn btn-ghost" style="width: 100%">Continue with Microsoft</button>
</div>
<div class="chk" style="background: #F3F7F2; border-color: #D0E2D4"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E6B4F" stroke-width="2" style="flex: none; margin-top: 2px"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg><span>We verify your email and set up two-step sign-in. Your TFN and bank details are encrypted and only visible to your assigned accountant.</span></div>
</div>
</template>

<template data-if="s1">
<div style="display: flex; flex-direction: column; gap: 20px">
<div><h1 class="h" style="margin: 0 0 6px; font-size: 32px">About your venue</h1><p class="muted" style="margin: 0">Helps us price accurately and set up your reports.</p></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<label class="f">Business / trading name<input type="text" placeholder="e.g. Little Saigon Kitchen"></label>
<label class="f">Legal entity type<select><option>Company (Pty Ltd)</option><option>Trust</option><option>Partnership</option><option>Sole trader</option></select></label>
<label class="f">ABN<input type="text" inputmode="numeric" placeholder="11 digits"><span class="hint">Checked against the ABN Lookup register</span></label>
<label class="f">TFN<input type="password" inputmode="numeric" autocomplete="off"><span class="hint">Optional now · stored encrypted, never emailed</span></label>
<label class="f">Venue postcode<input type="text" inputmode="numeric" maxlength="4"></label>
<label class="f">Number of venues<select><option>1</option><option>2</option><option>3</option><option>4+</option></select></label>
<label class="f">Venue type<select><option>Café</option><option>Restaurant</option><option>Bar / pub</option><option>Bakery</option><option>Food truck</option><option>Catering</option></select></label>
<label class="f">Cuisine<select><option>Vietnamese</option><option>Italian</option><option>Modern Australian</option><option>Chinese</option><option>Japanese</option><option>Thai</option><option>Indian</option><option>Middle Eastern</option><option>Other</option></select></label>
<label class="f">Number of employees<select><option>1–5</option><option>6–15</option><option>16–30</option><option>31–60</option><option>60+</option></select></label>
<label class="f">Estimated annual turnover<select><option>Under $500k</option><option>$500k – $1m</option><option>$1m – $2m</option><option>$2m – $5m</option><option>Over $5m</option></select></label>
<label class="f">Point of sale<select><option>Square</option><option>Lightspeed</option><option>Abacus</option><option>H&amp;L</option><option>Other / none</option></select></label>
<label class="f">Delivery platforms<select><option>Uber Eats + DoorDash</option><option>Uber Eats only</option><option>DoorDash only</option><option>None</option></select></label>
</div>
<label class="f">Current accountant (we'll arrange the handover)<input type="text" placeholder="Firm name and contact email"></label>
</div>
</template>

<template data-if="s2">
<div style="display: flex; flex-direction: column; gap: 18px">
<div><h1 class="h" style="margin: 0 0 6px; font-size: 32px">Engagement &amp; agreements</h1><p class="muted" style="margin: 0">Please read and sign. A PDF copy is saved to your Documents.</p></div>
<div style="border: 1px solid #E5DED0; border-radius: 12px; padding: 18px 20px; max-height: 220px; overflow: auto; font-size: 14px; line-height: 1.6; background: #F3ECE0" tabindex="0" aria-label="Engagement letter">
<strong>Letter of engagement</strong><br>
Scope: {{ scopeText }}, as listed in Schedule A. Fees: ${{ quoteTotal }}/month including GST, billed monthly in advance; first month free. Out-of-scope work is quoted before it starts. Your responsibilities: provide complete records, respond to queries within 10 business days, keep your accounting file access active. Term: month to month, 30 days' notice. Professional standards: APES 305 Terms of Engagement; Tax Agent Services Act 2009 Code of Professional Conduct. [Full legal text to be supplied by Trebly]
</div>
<label class="chk"><input type="checkbox"><span>I have read and accept the <a href="#e">letter of engagement</a> and <a href="#e">terms of service</a>.</span></label>
<label class="chk"><input type="checkbox"><span>I consent to the collection and use of my information under the <a href="#e">privacy policy</a>, including my TFN for tax-agent services.</span></label>
<label class="chk"><input type="checkbox"><span>I consent to <strong>offshoring</strong>: some work, such as bookkeeping and preparation, may be done by Trebly staff in [country, e.g. Vietnam] under the same privacy and confidentiality obligations. Review and lodgement stay with our Australian registered tax agent. <a href="#e">Read the offshoring disclosure</a>.</span></label>
<label class="chk"><input type="checkbox"><span>I authorise Trebly to act as my tax agent / BAS agent and to be added to my ATO client list.</span></label>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<label class="f">Sign by typing your full name<input type="text" style="font-family: 'Playfair Display',serif; font-size: 20px"></label>
<label class="f">Position<select><option>Director</option><option>Trustee</option><option>Partner</option><option>Owner</option></select></label>
</div>
</div>
</template>

<template data-if="s3">
<div style="display: flex; flex-direction: column; gap: 20px">
<div><h1 class="h" style="margin: 0 0 6px; font-size: 32px">Give us access to your books</h1><p class="muted" style="margin: 0">Pick your software. You stay the owner of your file and can remove us at any time.</p></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
<button type="button" class="{{ xeroCls }}" onClick="{{ pickXero }}" style="text-align: left; font: inherit; cursor: pointer"><strong style="font-size: 18px">Xero</strong><span class="muted" style="font-size: 14px">Connect in one click, or invite us as an adviser</span></button>
<button type="button" class="{{ myobCls }}" onClick="{{ pickMyob }}" style="text-align: left; font: inherit; cursor: pointer"><strong style="font-size: 18px">MYOB Business</strong><span class="muted" style="font-size: 14px">Invite our practice email to your file</span></button>
<button type="button" class="{{ noneCls }}" onClick="{{ pickNone }}" style="text-align: left; font: inherit; cursor: pointer"><strong style="font-size: 18px">Nothing yet</strong><span class="muted" style="font-size: 14px">We'll set up Xero for you at our partner rate</span></button>
</div>
<template data-if="isXero">
<div style="display: flex; flex-direction: column; gap: 14px; background: #F3ECE0; border-radius: 14px; padding: 22px">
<button type="button" class="btn btn-primary" style="align-self: flex-start">Connect to Xero</button>
<span class="muted" style="font-size: 14px">Opens Xero's secure sign-in. You approve read access to reports and journals, then come back here. Connected · <strong style="color: #2E6B4F">waiting</strong></span>
<hr style="border: 0; border-top: 1px solid #E5DED0; margin: 4px 0; width: 100%">
<strong>Also invite us as a user (so we can reconcile and lodge):</strong>
<ol style="margin: 0; padding-left: 20px; line-height: 1.8">
<li>In Xero, open <em>Settings → Users → Invite a user</em></li>
<li>Email: <strong>[xero@trebly.com.au]</strong> · Role: <strong>Adviser</strong></li>
<li>Tick below once sent — we accept within one business day</li>
</ol>
<label class="chk"><input type="checkbox"><span>I've sent the Xero invitation</span></label>
</div>
</template>
<template data-if="isMyob">
<div style="display: flex; flex-direction: column; gap: 12px; background: #F3ECE0; border-radius: 14px; padding: 22px">
<strong>Invite us to your MYOB file:</strong>
<ol style="margin: 0; padding-left: 20px; line-height: 1.8">
<li>In MYOB Business, open <em>Settings → User access → Invite user</em></li>
<li>Email: <strong>[myob@trebly.com.au]</strong> · Access: <strong>Accountant / Administrator</strong></li>
<li>Or add Trebly as your partner via the MYOB Practice invite</li>
</ol>
<label class="chk"><input type="checkbox"><span>I've sent the MYOB invitation</span></label>
</div>
</template>
<template data-if="isNone">
<div style="background: #F3ECE0; border-radius: 14px; padding: 22px; line-height: 1.6">We'll create a Xero subscription in your business's name, connect your bank feeds and POS, and send you the owner invite. Setup is included in your first month.</div>
</template>
<label class="f">Upload last year's financials and tax return (optional)<input type="file" style="padding: 10px 12px"><span class="hint">PDF, Excel or CSV · helps us start before your old accountant replies</span></label>
</div>
</template>

<template data-if="s4">
<div style="display: flex; flex-direction: column; gap: 20px">
<div><h1 class="h" style="margin: 0 0 6px; font-size: 32px">Payment method</h1><p class="muted" style="margin: 0">Nothing is charged today. Your first payment is on 27 November 2026.</p></div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; background: #1F3A30; color: #fff; border-radius: 14px; padding: 20px 22px">
<div><div style="font-size: 13px; color: #C6D1CB">Your plan</div><strong class="h" style="font-size: 22px">{{ planLine }}</strong></div>
<div style="text-align: right"><div style="font-size: 13px; color: #C6D1CB">Today</div><strong class="h" style="font-size: 22px; color: #E2A962">$0.00</strong></div>
</div>
<div role="group" aria-label="Payment type" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<button type="button" class="{{ cardCls }}" onClick="{{ pickCard }}" style="text-align: left; font: inherit; cursor: pointer"><strong>Credit / debit card</strong><span class="muted" style="font-size: 14px">Visa, Mastercard, Amex</span></button>
<button type="button" class="{{ ddCls }}" onClick="{{ pickDd }}" style="text-align: left; font: inherit; cursor: pointer"><strong>Direct debit (bank account)</strong><span class="muted" style="font-size: 14px">Lower fees · BECS direct debit</span></button>
</div>
<template data-if="isCard">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<label class="f" style="grid-column: 1 / -1">Card number<input type="text" inputmode="numeric" autocomplete="cc-number"></label>
<label class="f">Expiry<input type="text" placeholder="MM / YY" autocomplete="cc-exp"></label>
<label class="f">CVC<input type="text" inputmode="numeric" autocomplete="cc-csc"></label>
<label class="f">Name on card<input type="text" autocomplete="cc-name"></label>
</div>
</template>
<template data-if="isDd">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<label class="f">Account name<input type="text"></label>
<label class="f">BSB<input type="text" inputmode="numeric"></label>
<label class="f">Account number<input type="text" inputmode="numeric"></label>
<label class="chk" style="grid-column: 1 / -1"><input type="checkbox"><span>I accept the direct debit request and service agreement.</span></label>
</div>
</template>
<span class="muted" style="font-size: 13px">Card and bank details go straight to our payment provider and are never stored by Trebly. Tax invoices are emailed and saved in your portal.</span>
</div>
</template>

<template data-if="s5">
<div style="display: flex; flex-direction: column; gap: 18px; align-items: flex-start">
<span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 50%; background: #2E6B4F; color: #fff; display: grid; place-items: center; font-size: 28px">✓</span>
<h1 class="h" style="margin: 0; font-size: 34px">You're in. Welcome to The Eatery Firm.</h1>
<p class="muted" style="margin: 0; font-size: 17px; line-height: 1.6; max-width: 620px">Your accountant, [Accountant name], will call within one business day. Meanwhile we've contacted your old accountant and are reading your Xero file.</p>
<ul style="margin: 0; padding-left: 20px; line-height: 1.9">
<li>Engagement letter signed and saved to Documents</li>
<li>Xero connected · first data sync running</li>
<li>Onboarding call: book a time on your Schedule</li>
</ul>
<a class="btn btn-primary" href="#Dashboard">Go to my dashboard</a>
</div>
</template>

<template data-if="showNav">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; border-top: 1px solid #E5DED0; padding-top: 22px">
<button type="button" class="btn btn-ghost" onClick="{{ back }}">Back</button>
<button type="button" class="btn btn-primary" onClick="{{ next }}">{{ nextLabel }}</button>
</div>
</template>
</div>
</main>
</div>
</div>
</template><template id="tpl-Dashboard">

<div style="min-height: 100%; display: flex; flex-wrap: wrap; align-items: stretch">

<aside class="side" style="flex: 1 1 240px; max-width: 100%; background: #1F3A30; color: #fff; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box">
<a href="#Main" style="gap: 10px; margin-bottom: 14px; color: #fff"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 40 48" style="flex:none"><rect x="4" y="12" width="5" height="18" rx="2.5" fill="#F4EEE2"/><rect x="12.5" y="6" width="5" height="24" rx="2.5" fill="#F4EEE2"/><rect x="21" y="2" width="5" height="28" rx="2.5" fill="#F4EEE2"/><rect x="29.5" y="0" width="5" height="30" fill="#C1904A"/><path d="M4 24h30.5v4c0 6-5 9.5-10.5 12H15C9 37.5 4 34 4 28z" fill="#F4EEE2"/><rect x="17" y="34" width="6" height="14" rx="3" fill="#F4EEE2"/></svg><span class="h" style="font-weight: 700; font-size: 18px">The Eatery Firm</span></a>
<a class="ai-nav" href="#Dashboard--ask"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="flex:none"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z"/><path d="M19 15l.9 2.4 2.4.9-2.4.9L19 21.6l-.9-2.4-2.4-.9 2.4-.9z"/></svg>Ask AI</a>
<a class="on" href="#Dashboard">Dashboard</a>
<a href="#Analysis">Benchmarking and Performance Analysis</a>
<a href="#Legal">Legal<span class="nbadge lbadge" aria-label="Legal items needing attention">4</span></a>
<a href="#Reports">Reports &amp; documents<span class="nbadge" aria-label="2 documents to sign">2</span></a>
<a href="#Schedule">Work schedule</a>
<a href="#Assistant--partners">More services</a>
<a href="#billing">Settings &amp; billing</a>
<a href="#Logout">Log out</a>
</aside>

<main style="flex: 999 1 640px; min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 22px; box-sizing: border-box">

<div class="dhead" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px">
<div><div class="muted" style="font-size: 14px">Tuesday 27 October 2026</div><h1 class="h" style="margin: 2px 0 0; font-size: 34px">Good morning, [Owner]</h1></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">Venue<select style="font: inherit; min-height: 44px; border: 1px solid #BFB6A4; border-radius: 10px; padding: 0 10px; background: #fff"><option>Little Saigon Kitchen (demo)</option><option>All venues</option></select></label>
<a class="btn btn-primary" href="#Assistant">✦ Ask AI</a>
</div>
</div>
<section id="ask" class="ai-panel" aria-labelledby="ai-h">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px">
<h2 id="ai-h" style="margin: 0; font-size: 17px; font-weight: 700; font-family: Inter, system-ui, sans-serif; display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="color: #E2A962; font-size: 20px">✦</span>Ask AI about your business</h2>
<span style="font-size: 12px; color: #A5B3AC">Answers from your books, reports and benchmarks</span>
</div>
<form class="ai-form" novalidate onSubmit="{{ aiSubmit }}">
<label for="ai-q" class="sr-only">Your question</label>
<input id="ai-q" type="text" autocomplete="off" placeholder="Ask anything about your numbers, tax or what's due…" value="{{ aiTyped }}" onInput="{{ aiOnInput }}">
<button type="submit" class="ai-send">Ask</button>
</form>
<div class="ai-chips" role="group" aria-label="Suggested questions">
<template data-for="aiChips" data-as="c"><button type="button" class="{{ c.cls }}" onClick="{{ c.go }}">{{ c.label }}</button></template>
</div>
<template data-if="aiShow">
<div class="ai-answer" aria-live="polite">
<div class="ai-q-bubble">{{ aiAsked }}</div>
<template data-if="aiThinking"><div class="ai-thinking"><span></span><span></span><span></span> Checking your books…</div></template>
<template data-if="aiReady">
<strong style="font-size: 16px; line-height: 1.4; color: #fff">{{ aiAns.title }}</strong>
<template data-for="aiAns.paras" data-as="t"><p style="margin: 0; font-size: 14px; line-height: 1.6; color: #E3E8E4">{{ t }}</p></template>
<template data-if="aiAns.items"><ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.55; color: #E3E8E4"><template data-for="aiAns.items" data-as="it"><li><strong style="color: #fff">{{ it.b }}</strong> {{ it.t }}</li></template></ul></template>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-top: 4px">
<span style="font-size: 12px; color: #A5B3AC">{{ aiAns.src }}</span>
<span style="display: flex; gap: 8px; flex-wrap: wrap"><template data-if="aiAns.cta"><a class="btn ai-cta" href="{{ aiAns.ctaHref }}">{{ aiAns.cta }}</a></template><a class="btn ai-ghost" href="#Assistant">Open full chat</a></span>
</div>
</template>
</div>
</template>
</section>
<nav class="jump" aria-label="Jump to section"><a href="#Dashboard--todo" style="background: #A4472A; color: #fff; border-color: #A4472A">To do ({{ todoCount }})</a><a href="#Dashboard--priorities">Action plan</a><a href="#Analysis">Benchmarks &amp; analysis →</a><a href="#Dashboard--queries">Questions</a></nav>

<section id="todo" aria-labelledby="todo-h" class="todo">
<div class="todo-head">
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" class="todo-count">{{ todoCount }}</span><h2 id="todo-h" style="margin: 0; font-size: 18px; font-weight: 700; font-family: Inter, system-ui, sans-serif">Action needed from you</h2></div>
<span style="font-size: 13px; font-weight: 600">{{ todoSummary }}</span>
</div>
<ul style="margin: 0; padding: 0; list-style: none">
<template data-for="todos" data-as="t">
<li class="{{ t.cls }}">
<span class="todo-ic" style="background: {{ t.bg }}; color: {{ t.c }}"><span data-html="t.icon" style="display: grid"></span></span>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center"><span class="todo-pill" style="background: {{ t.c }}; color: #fff">{{ t.lab }}</span><template data-if="t.src"><span class="todo-pill" style="background: #1F3A30; color: #E2A962">{{ t.src }}</span></template><span style="font-size: 13px; font-weight: 600; color: {{ t.c }}">{{ t.due }}</span></div>
<strong style="font-size: 16px; line-height: 1.35">{{ t.title }}</strong>
<span class="muted" style="font-size: 14px; line-height: 1.5">{{ t.desc }}</span>
</div>
<a class="{{ t.btnCls }}" href="{{ t.href }}">{{ t.btn }}</a>
</li>
</template>
</ul>

const HOLE=/\{\{\s*([^}]+?)\s*\}\}/g;
function look(path,sc){path=path.trim();if(path==='true')return true;if(path==='false')return false;if(/^-?\d+(\.\d+)?$/.test(path))return +path;let v=sc;for(const k of path.split('.')){if(v==null)return undefined;v=v[k];}return v;}
function interp(s,sc){return s.replace(HOLE,(m,p)=>{const v=look(p,sc);return v==null?'':String(v);});}
function render(node,sc,out){
  if(node.nodeType===3){out.push(document.createTextNode(interp(node.nodeValue,sc)));return;}
  if(node.nodeType!==1){return;}
  if(node.tagName==='TEMPLATE'&&node.dataset.for){const list=look(node.dataset.for,sc)||[];list.forEach((it,i)=>{const s2=Object.assign({},sc,{[node.dataset.as]:it,$index:i});node.content.childNodes.forEach(c=>render(c,s2,out));});return;}
  if(node.tagName==='TEMPLATE'&&node.dataset.if){if(look(node.dataset.if,sc))node.content.childNodes.forEach(c=>render(c,sc,out));return;}
  const el=node.cloneNode(false);
  if(node.dataset&&node.dataset.html){el.removeAttribute('data-html');el.innerHTML=look(node.dataset.html,sc)||'';out.push(el);return;}
  for(const a of Array.from(el.attributes)){if(a.value.indexOf('{{')<0)continue;
    if(/^on/.test(a.name)){const m=/^\{\{\s*([^}]+?)\s*\}\}$/.exec(a.value);el.removeAttribute(a.name);const fn=m&&look(m[1],sc);if(typeof fn==='function')el.addEventListener(a.name.slice(2),fn);}
    else el.setAttribute(a.name,interp(a.value,sc));}
  node.childNodes.forEach(c=>{const kids=[];render(c,sc,kids);kids.forEach(k=>el.appendChild(k));});
  out.push(el);
}
